name = "malastranapp-backend"
main = "src/server.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./dist"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "malastranapp-db"
database_id = "__D1_DATABASE_ID__"

[dev]
port = 5173
